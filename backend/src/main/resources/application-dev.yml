# 로컬 PC 에서 PostgreSQL 에 붙여 개발할 때 쓰는 프로필.
# 접속 정보는 backend/.env (또는 환경 변수) 에 넣는다. .env.example 참고.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      # 실제 DB 를 지우지 않도록 자동 실행하지 않는다. db/postgresql/*.sql 을 직접 적용한다.
      mode: never

app:
  jwt:
    # 개발용 키(Base64, 디코딩 후 48바이트). 운영에서는 반드시 JWT_SECRET 환경 변수 사용
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2hvcC1hcGktand0LXNlY3JldC1rZXktZG8tbm90LXVzZS1pbi1wcm9k}
