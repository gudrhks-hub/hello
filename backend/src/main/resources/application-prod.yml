spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never

app:
  jwt:
    secret: ${JWT_SECRET}
  cookie:
    secure: true
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
