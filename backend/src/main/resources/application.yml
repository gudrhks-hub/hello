spring:
  application:
    name: shop-api
  profiles:
    default: local
  config:
    # backend/.env 가 있으면 DB 접속 정보 등을 읽는다(없으면 무시). 환경 변수가 우선한다.
    import: optional:file:.env[.properties]
  jackson:
    time-zone: Asia/Seoul

server:
  port: 8080

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

app:
  jwt:
    issuer: shop-api
    access-token-validity-seconds: 10800
    refresh-token-validity-seconds: 1209600
  cookie:
    secure: false
  cors:
    allowed-origins: http://localhost:5173
